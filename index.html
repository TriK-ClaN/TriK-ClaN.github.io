<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Neot Interview Guide</title>
    <meta name="description" content="Interactive preparation guide for the Neot Capital Investment Analyst internship interview, covering project finance, valuation, EV fleet economics and interview practice.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f5f7f6">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

    <!-- Apply Saved Theme Before First Paint -->
    <script>
      (function () {
        try {
          var mode = JSON.parse(localStorage.getItem("neotGuide:theme"));
          if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
        } catch (error) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css?v=6">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="shell">
      <!-- Mobile Top Bar -->
      <header class="topbar">
        <button type="button" class="icon-btn" id="menu-toggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="brand" href="#/">
          <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg></span>
          <span class="brand-text"><span class="brand-title">Neot Interview Guide</span></span>
        </a>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" data-open-search aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="theme-quick" aria-label="Toggle light or dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/">
          <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg></span>
          <span class="brand-text"><span class="brand-title">Neot Interview Guide</span><span class="brand-sub">Investment Analyst · Mobility</span></span>
        </a>

        <button type="button" class="search-trigger" data-open-search>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search the guide</span><kbd>Ctrl K</kbd>
        </button>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-footer">
          <div class="readiness-mini">
            <span class="muted">Readiness</span>
            <div class="readiness-bar"><span id="readiness-fill"></span></div>
            <strong id="readiness-value">0%</strong>
          </div>
          <div class="theme-toggle" role="group" aria-label="Colour theme">
            <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" data-theme-choice="system" aria-label="Match system theme" title="System">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </button>
            <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="scrim" id="scrim" aria-hidden="true"></div>

      <!-- Main Content -->
      <main class="main" id="main" tabindex="-1">
        <noscript>
          <div class="card">This guide is interactive and requires JavaScript to be enabled.</div>
        </noscript>
      </main>
    </div>

    <!-- Search Dialog -->
    <dialog class="search-dialog" id="search-dialog" aria-label="Search the guide">
      <div class="search-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search-input" placeholder="Search DSCR, sculpting, TCO, BFR…" autocomplete="off" aria-label="Search query">
        <kbd>Esc</kbd>
      </div>
      <ul class="search-results" id="search-results"></ul>
    </dialog>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <!-- Content and Application Scripts -->
    <script src="assets/js/core.js?v=6" defer></script>
    <script src="assets/js/data/modules.js?v=6" defer></script>
    <script src="assets/js/data/practice.js?v=6" defer></script>
    <script src="assets/js/data/reference.js?v=6" defer></script>
    <script src="assets/js/tools.js?v=6" defer></script>
    <script src="assets/js/views.js?v=6" defer></script>
    <script src="assets/js/app.js?v=6" defer></script>
  </body>
</html>
